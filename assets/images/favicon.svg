<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5" />
  
  <!-- Subtle top sheen -->
  <path d="M 4 20 C 4 11 11 4 20 4 L 44 4 C 53 4 60 11 60 20 L 60 26 C 45 22 19 22 4 26 Z" fill="url(#highlight)" />

  <!-- Monogram "SL" -->
  <text x="31" y="36" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="27" 
        font-weight="900" 
        letter-spacing="-1.2px" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="central">SL</text>

  <!-- Status / Portal indicator dot (emerald with white border) -->
  <circle cx="50" cy="14" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
</svg>

